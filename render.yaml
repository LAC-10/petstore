services:
  # ── Backend (Docker Web Service) ──────────────────────────────────────────
  - type: web
    name: petstore-api
    plan: free
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      # ... (database env vars) ...
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: petstore-web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Static CDN Site) ────────────────────────────────────────────
  - type: web
    name: petstore-web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-api
          envVarKey: RENDER_EXTERNAL_URL

# ── Database (Managed PostgreSQL) ──────────────────────────────────────────
databases:
  - name: petstore-db
    plan: free
    databaseName: petstore
    user: petstore
