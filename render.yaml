services:
  # ── Backend (Docker Public Web Container) ──────────────────────────────────
  - type: web
    name: petstore-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://petstore-frontend.onrender.com"

  # ── Frontend (Static CDN Site) ──────────────────────────────────────────────
  - type: web
    name: petstore-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://petstore-backend.onrender.com"
