services:
  # ── Backend (Docker Public Web Container) ──────────────────────────────────
  - type: web
    name: petstore-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: static
          name: petstore-frontend
          property: url

  # ── Frontend (Static CDN Site) ──────────────────────────────────────────────
  - type: static
    name: petstore-frontend
    buildCommand: "npm install && npm run build"
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-backend
          property: url
